# ============================================================
# 个人作品集网站 - nginx 站点配置（宝塔面板）
# 用法: 宝塔 -> 网站 -> 对应站点 -> 设置 -> 配置文件，整段替换
#       （注意: 宝塔会按需注入 ssl、php 等片段，如已有请保留）
# 假设:
#   - 前端构建产物位于 /www/wwwroot/portfolio/frontend/dist
#   - 后端运行于本机 9096 端口（须与 backend application.yml 的 server.port 一致）
# ============================================================

server {
    listen 80;
    # 改成你的域名或服务器 IP
    server_name example.com;

    # 前端静态文件根目录（npm run build 产物）
    root /www/wwwroot/portfolio/frontend/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退: 找不到静态文件时交给 index.html（vue-router history 模式必需）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理（端口须与后端 server.port 一致，默认 9096）
    location /api/ {
        proxy_pass http://127.0.0.1:9096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 私厨 Agent API 反向代理（FastAPI，8002 端口）
    # 注意: 更具体的 /api/chief 必须放在通用 /api/ 之前（nginx 前缀最长匹配，顺序不影响，但集中放一起便于维护）
    location /api/chief/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式对话关键配置: 禁用代理缓冲，否则流式响应会被攒到结束才下发
        proxy_buffering off;
        proxy_cache off;
        # Agent 检索食谱耗时较长（web 搜索 + 多轮推理），放宽超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 支持 HTTP/1.1 长连接与分块传输
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Spring Boot Actuator 健康检查（仅建议内网/监控访问，生产可加 allow 限制）
    location /actuator/health {
        proxy_pass http://127.0.0.1:9096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 常见静态文件日志格式
    access_log /www/wwwlogs/portfolio.log;
    error_log  /www/wwwlogs/portfolio.error.log;
}
